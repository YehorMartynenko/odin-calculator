<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./js/calculator.js" defer></script>
    <link rel="stylesheet" href="./css/style.css">

    <title>Calculator</title>
</head>
<body>
    <div id="calculator">
        <div id="display">
            <div id="history">
            </div>
            <div id="calculation">
                <spin class="calculation-textfield"></spin>
            </div>
        </div>
        <div id="controls">
             <div id="top-panel">
                <button class="extra">CLEAR</button>
                <button class="extra">DELETE</button>
            </div>
            <div id="bottom-panel">
                <div class="keypad-row">
                     <button class="keypad-button">7</button>
                     <button class="keypad-button">8</button>
                     <button class="keypad-button">9</button>
                     <button class="keypad-button operator">÷</button>
                </div>
                <div class="keypad-row">
                     <button class="keypad-button">4</button>
                     <button class="keypad-button">5</button>
                     <button class="keypad-button">6</button>
                     <button class="keypad-button operator">x</button>
                </div>
                <div class="keypad-row">
                     <button class="keypad-button">1</button>
                     <button class="keypad-button">2</button>
                     <button class="keypad-button">3</button>
                     <button class="keypad-button operator">-</button>
                </div>
                <div class="keypad-row">
                     <button class="keypad-button">0</button>
                     <button class="keypad-button">.</button>
                     <button class="keypad-button operator equals-sign">=</button>
                     <button class="keypad-button operator">+</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
